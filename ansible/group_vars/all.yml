---
# Defaults for the whole gateway. Per-machine overrides go in local/vars.yml (git-ignored).

gateway_hostname: cornil.fritz.box

# Final state: standard ports (needs the one-time `make bootstrap-ports`).
# For the trial beside the legacy Caddy: make deploy HTTP_PORT=8080 HTTPS_PORT=8443
gateway_http_port: 80
gateway_https_port: 443

# Official image, pinned. Change deliberately, then run `make deploy`.
caddy_image: docker.io/library/caddy:2.11.2

# Where Caddy finds each app.
# Tax app: by container name on the shared `gateway` network (the port INSIDE the container). Needs the tax
#   unit to have Network=gateway.network. Before that it was host.containers.internal:8890.
# parts-db: rootless container `parts-db-web` on the same `gateway` network, by name (ADR 0003).
#   Rollback value (the old rootful container, reached through the host; needs parts-db to listen on all
#   interfaces): host.containers.internal:8888
tax_upstream: tax-healthcare-tool-web:8000
partsdb_upstream: parts-db-web:8000

caddy_data_backups_to_keep: 7

# The portal page served at https://<hostname>/ (ADR 0004).
# Where Caddy finds the page INSIDE the container. deploy.yml writes it to <gateway_home>/config/portal/,
# and <gateway_home>/config is already mounted read-only at /etc/caddy, so no unit change is needed.
gateway_portal_dir: /etc/caddy/portal

# One entry per application shown on the portal page. `path` must end in a slash and must match a route in
# ansible/templates/Caddyfile.j2 (scripts/test.sh checks this). `icon` is a short emoji or a few characters.
# To add an app: add its handle_path block and upstream variable to the Caddyfile template, then add an entry here.
portal_apps:
  - name: Parts DB
    path: /parts-db/
    icon: "🔩"
    description: Electronics parts on hand and where they are stored.
  - name: Tax & Healthcare
    path: /tax-healthcare/
    icon: "🧾"
    description: Multi-country income overview for health insurance and the German tax return.
  # Example of a third app (remove the leading "# " and add its route in the Caddyfile template):
  # - name: Example App
  #   path: /example-app/
  #   icon: "🏠"
  #   description: One line saying what it is for.
