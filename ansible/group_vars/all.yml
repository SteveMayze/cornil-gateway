---
# Defaults for the whole gateway. Per-machine overrides go in local/vars.yml (git-ignored).

gateway_hostname: cornil.fritz.box

# Final state: standard ports (needs the one-time `make bootstrap-ports`).
# For the trial beside the legacy Caddy: make deploy HTTP_PORT=8080 HTTPS_PORT=8443
gateway_http_port: 80
gateway_https_port: 443

# Official image, pinned. Change deliberately, then run `make deploy`.
caddy_image: docker.io/library/caddy:2.11.2

# Where Caddy finds each app.
# Tax app: by container name on the shared `gateway` network (the port INSIDE the container). Needs the tax
#   unit to have Network=gateway.network. Before that it was host.containers.internal:8890.
# parts-db: rootless container `parts-db-web` on the same `gateway` network, by name (ADR 0003).
#   Rollback value (the old rootful container, reached through the host; needs parts-db to listen on all
#   interfaces): host.containers.internal:8888
tax_upstream: tax-healthcare-tool-web:8000
partsdb_upstream: parts-db-web:8000

caddy_data_backups_to_keep: 7

# The portal page served at https://<hostname>/ (ADR 0004).
# Where Caddy finds the page INSIDE the container. deploy.yml writes it to <gateway_home>/config/portal/,
# and <gateway_home>/config is already mounted read-only at /etc/caddy, so no unit change is needed.
gateway_portal_dir: /etc/caddy/portal

# One entry per application shown on the portal page. `path` must end in a slash and must match a route in
# ansible/templates/Caddyfile.j2 (scripts/test.sh checks this). `icon` is a short emoji or a few characters.
# To add an app: add its handle_path block and upstream variable to the Caddyfile template, then add an entry here.
portal_apps:
  - name: Parts DB
    path: /parts-db/
    icon: "🔩"
    description: Electronics parts on hand and where they are stored.
  - name: Tax & Healthcare
    path: /tax-healthcare/
    icon: "🧾"
    description: Multi-country income overview for health insurance and the German tax return.
  # Example of a third app (remove the leading "# " and add its route in the Caddyfile template):
  # - name: Example App
  #   path: /example-app/
  #   icon: "🏠"
  #   description: One line saying what it is for.

# ---- Shared platform: PostgreSQL (ADR 0005 and 0006) -------------------------------------------------------
# Official image, pinned to an exact tag (never `latest`). The `-trixie` variant is Debian 13, like the host.
# Changing the tag to another PATCH release of 17 is safe; read the release notes first. A new MAJOR version
# is NOT an in-place change: it needs a dump and restore. The image's operating system decides the text
# sort order (en_US.utf8), so after any change that moves to a new OS release run REINDEX (docs/postgres.md).
postgres_image: docker.io/library/postgres:17.11-trixie

# The `postgres` user inside the official image is uid/gid 999. UserNS=keep-id maps it to the service user, so
# the files on /u01 belong to that user on the host.
postgres_uid: 999
postgres_gid: 999

# Folders. The data lives on the USB disk; the small config (pg_hba.conf) stays on the eMMC.
u01_mount: /u01
postgres_data_dir: /u01/data/postgres
postgres_backup_dir: /u01/data/backups/postgres

# The private `db` network. The subnet is fixed so pg_hba.conf can accept connections from exactly this range.
# It must not overlap the `gateway` network or the home LAN.
db_network_name: db
db_subnet: 10.89.100.0/24

# Sized for 3.7 GB of RAM shared with Caddy and two Django apps. Durability settings (fsync, synchronous_commit,
# full_page_writes) are deliberately NOT here as tunables: they stay on because the disk is bus-powered USB.
postgres_memory_limit: 1g
postgres_pids_limit: 200
postgres_shm_size: 128m
postgres_max_connections: 50
postgres_shared_buffers: 256MB
postgres_effective_cache_size: 768MB
postgres_work_mem: 8MB
postgres_maintenance_work_mem: 64MB
postgres_stop_timeout: 110

# ---- Backups and disk health (Phase U3, ADR 0007) -----------------------------------------------------------
# Nightly dump of every app database (inside the postgres container), kept on /u01.
pg_backup_calendar: "*-*-* 02:15:00"
pg_backup_random_delay: 15min
pg_backup_keep_daily: 14     # the newest dump of each of the last 14 days that have one
pg_backup_keep_monthly: 12   # plus the newest dump of each of the last 12 months that have one; the newest dump is always kept

# Offsite copy with restic, run as a container (no root, nothing to install). The repository address and any
# target credentials are NOT here: put `restic_repository` (and optional values) in local/vars.yml (git-ignored)
# and create the passwords as Podman secrets on the server (docs/offsite-backup.md).
restic_image: docker.io/restic/restic:0.19.1
restic_repository: CHANGE-ME-IN-LOCAL-VARS
restic_password_secret: restic-repo-password
restic_calendar: "*-*-* 04:30:00"
restic_random_delay: 30min
restic_keep_daily: 7
restic_keep_weekly: 5
restic_keep_monthly: 12
# What is sent offsite: the database dumps and every app's own backup archive. Read-only inside the container.
restic_backup_paths:
  - /u01/data/backups
  - /u01/data/parts-db/backups
  - /u01/data/tax-healthcare-tool/backups
# Extra Podman secrets the chosen target needs, as {secret: <podman secret name>, env: <variable name>} pairs
# (for example an S3 bucket's access key). Empty for an SFTP target that uses a key file.
restic_extra_secrets: []
# Folder on the server (eMMC) holding the SSH key and known_hosts for an SFTP target; leave empty if unused.
restic_ssh_dir: ""

# Disk health (docs/disk-health.md). The one-time sudo bootstrap installs a small root-owned job that writes a
# status file the service user can read. The monthly long self-test is a proposal: off until the owner approves.
disk_health_status_dir: /var/lib/cornil-disk-health
disk_health_calendar: "*-*-* 06:00:00"
disk_smart_long_test: false
disk_smart_long_test_calendar: "*-*-01 03:00:00"
