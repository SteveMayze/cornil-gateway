---
# Renders the templates on THIS machine into render_dir, so tests and humans can look at the real artifacts.
# Used by `make render` and scripts/test.sh. Touches nothing on the server.
- name: Render gateway templates locally
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    render_dir: "{{ playbook_dir }}/../build"
    gateway_home: /home/example-user/cornil-gateway
    platform_home: /home/example-user/cornil-platform
  tasks:
    - name: Make the output directory
      ansible.builtin.file: {path: "{{ render_dir }}", state: directory, mode: "0755"}
    - name: Render each template
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ render_dir }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - {src: Caddyfile.j2, dest: Caddyfile}
        - {src: gateway.network.j2, dest: gateway.network}
        - {src: caddy.container.j2, dest: caddy.container}
        - {src: db.network.j2, dest: db.network}
        - {src: postgres.container.j2, dest: postgres.container}
        - {src: pg_hba.conf.j2, dest: pg_hba.conf}
        - {src: pg-dump.service.j2, dest: pg-dump.service}
        - {src: pg-dump.timer.j2, dest: pg-dump.timer}
        - {src: restic-backup.service.j2, dest: restic-backup.service}
        - {src: restic-backup.timer.j2, dest: restic-backup.timer}
        - {src: disk-health.sh.j2, dest: disk-health.sh}
        - {src: disk-health.service.j2, dest: disk-health.service}
        - {src: disk-health.timer.j2, dest: disk-health.timer}
        - {src: disk-selftest.service.j2, dest: disk-selftest.service}
        - {src: disk-selftest.timer.j2, dest: disk-selftest.timer}
    - name: Make the portal output directory
      ansible.builtin.file: {path: "{{ render_dir }}/portal", state: directory, mode: "0755"}
    - name: Render the portal page
      ansible.builtin.template:
        src: portal/index.html.j2
        dest: "{{ render_dir }}/portal/index.html"
        mode: "0644"
