# Copy to local/inventory.ini (git-ignored) and fill in your real values.
# Example values below are fake on purpose.
#
# [gateway]: the service user. Used by every routine command. SSH key, no sudo.
# [admin]:   your own admin login on the same server. Used ONLY by the labelled sudo steps
#            (make bootstrap-ports, make cutover, make rollback-legacy); Ansible asks for the sudo password.
[gateway]
cornil ansible_host=cornil.fritz.box ansible_user=homeapps

[admin]
cornil-admin ansible_host=cornil.fritz.box ansible_user=example-admin
